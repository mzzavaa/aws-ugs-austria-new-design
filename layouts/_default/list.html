{{ define "main" }}
<div class="container py-16">
    <h1 class="text-4xl font-bold mb-8 gradient-text">{{ .Title }}</h1>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        {{ range .Pages }}
        <a href="{{ .Permalink }}" class="feature-card p-6">
            <h2 class="text-xl font-bold mb-3">{{ .Title }}</h2>
            <p class="text-gray-300">{{ .Summary }}</p>
            <div class="mt-4 text-highlight-purple font-bold">Read more →</div>
        </a>
        {{ end }}
    </div>
</div>
{{ end }}
